function render(){for(var k in state)if(CELLS.indexOf(k)<0)delete state[k];var tags=board.querySelectorAll('.tag');for(var i=0;i<tags.length;i++)tags[i].remove();for(var id in state){var d=document.createElement('div'),p=pos(id);d.className='tag';d.style.left=p.x+'%';d.style.top=p.y+'%';d.textContent=state[id];board.appendChild(d);fit(d)}registered.textContent=names().length;drawn.textContent=used().length;remain.textContent=remaining().length;var label=areaSelect.options[areaSelect.selectedIndex].text;status.textContent=label+' / 登録 '+names().length+'人 / 配置済み '+used().length+'人 / 残り '+remaining().length+'人 / エリア空き '+free().length+'マス';areaHint.textContent=label+'：空き '+free().length+'マスから抽選します。';fixedF9();highlightArea();buildHits();save()}
function manual(cell){if(busy||areaCells().indexOf(cell)<0||state[cell])return;var person=prompt(cell+' に配置する名前を入力してください','');if(person===null)return;person=person.trim();if(!person)return;if(used().indexOf(person)>=0){alert(person+' はすでに配置済みです');return}history.push(JSON.stringify(state));state[cell]=person;render()}
function setBusy(v){busy=v;for(var i=0;i<buttons.length;i++)buttons[i].disabled=v}
function candidate(cell,person){var d=board.querySelector('.candidate');if(!d){d=document.createElement('div');d.className='candidate';board.appendChild(d)}var p=pos(cell);d.style.left=p.x+'%';d.style.top=p.y+'%';d.textContent=person;fit(d)}
function clearCandidate(){var d=board.querySelector('.candidate');if(d)d.remove()}
function immediate(){var p=remaining(),c=free();if(!p.length||!c.length)return false;history.push(JSON.stringify(state));state[pick(c)]=pick(p);render();return true}
function animated(){if(busy)return;var people=remaining(),spaces=free();if(!people.length){result.textContent='全員配置済みです';return}if(!spaces.length){result.textContent='選択エリアに空きマスがありません';return}setBusy(true);mapSection.scrollIntoView({behavior:'smooth',block:'start'});var person=pick(people),step=0,total=16,route=[],last='';for(var i=0;i<total-1;i++){var c=pick(spaces);if(spaces.length>1)while(c===last)c=pick(spaces);route.push(c);last=c}var finalCell=pick(spaces);route.push(finalCell);function move(){var cell=route[step];candidate(cell,person);result.textContent=person+' → '+cell+' ?';step++;if(step<route.length){var delay=step>=15?700:step>=13?520:step>=10?360:step>=6?260:180;setTimeout(move,delay);return}setTimeout(function(){clearCandidate();history.push(JSON.stringify(state));state[finalCell]=person;result.textContent=person+' → '+finalCell;render();setBusy(false)},420)}setTimeout(move,500)}
document.getElementById('one').onclick=animated;document.getElementById('all').onclick=function(){if(busy)return;var g=100;while(g--&&immediate()){}result.textContent=remaining().length?'選択エリアの空きマスがなくなりました':'全員配置完了'};document.getElementById('undo').onclick=function(){if(busy||!history.length)return;state=JSON.parse(history.pop());render()};document.getElementById('reset').onclick=function(){if(!busy&&confirm('配置結果を全部消しますか？')){state={};history=[];result.textContent='抽選待機中';render()}};document.getElementById('save').onclick=save;namesBox.oninput=render;areaSelect.onchange=function(){render()};
try{var n=localStorage.getItem(NAME_KEY),st=localStorage.getItem(STATE_KEY),ar=localStorage.getItem(AREA_KEY);if(n!==null)namesBox.value=n;if(st)state=JSON.parse(st);if(ar&&AREAS[ar])areaSelect.value=ar}catch(e){}render();
})();</script></body></html>
