function pos(id){let c='ABCDEFGHIJKLMN'.indexOf(id[0]),r=parseInt(id.slice(1)),xs=[220.5,289.5,358.5,427.5,496.5,565.5,634.5,703.5,772.5,841.5,910.5,979.5,1048.5,1117.5],ys=[153.8,222.5,291.3,360.6,430,498.4,567,636,704.8,773.8,843,912.3,981.3,1050.3,1119.5,1188.4,1257.1,1326];return{x:xs[c]/1263*100,y:ys[r-1]/1445*100}}
function keyName(k){let [g,i]=k.split('|');return groups[g]&&groups[g][+i]}
function activeNames(){return [...selected].map(k=>keyName(k)).filter(Boolean)}
function occupiedNames(){return Object.values(state)}
function remaining(){let used=occupiedNames();return activeNames().filter(n=>!used.includes(n))}
function pool(){return mode==='globe'?CELLS:(AREAS[$('area').value]||[])}
function free(){return pool().filter(c=>!MERGED.has(c)&&!state[c])}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function weightedCell(spaces){let normal=spaces.filter(c=>!RARE.includes(c)),rare=spaces.filter(c=>RARE.includes(c));if(rare.length&&(!normal.length||Math.random()<0.035))return pick(rare);return pick(normal.length?normal:rare)}
function fit(el){let n=[...el.textContent].length,size=n>24?4.5:n>18?5:n>13?5.5:n>9?6.5:n>6?7.5:9;el.style.fontSize=size+'px';el.style.lineHeight='.95'}
function renderMembers(){let q=$('search').value.toLowerCase(),box=$('members');box.innerHTML='';allMembers().filter(m=>(!filterGroup||m.g===filterGroup)&&m.name.toLowerCase().includes(q)).forEach(m=>{let row=document.createElement('div');row.className='member';row.style.setProperty('--c',COLORS[m.g]);row.innerHTML=`<input type="checkbox" ${selected.has(m.key)?'checked':''}><span class="badge">${m.g}</span><input type="text"><button class="del">×</button>`;let cb=row.children[0],inp=row.children[2];inp.value=m.name;cb.onchange=()=>{cb.checked?selected.add(m.key):selected.delete(m.key);saveAll();renderStats()};inp.onchange=()=>{groups[m.g][m.i]=inp.value.trim()||m.name;saveAll();renderAll()};row.children[3].onclick=()=>{groups[m.g].splice(m.i,1);selectedCity.clear();selectedGlobe.clear();selected=mode==='city'?selectedCity:selectedGlobe;saveAll();renderAll()};box.appendChild(row)});renderStats()}
function renderGroupButtons(){let d=$('groupButtons');d.innerHTML='';Object.keys(groups).forEach(g=>{let b=document.createElement('button');b.className='groupBtn'+(filterGroup===g?' on':'');b.style.setProperty('--c',COLORS[g]);b.textContent=g+' ('+groups[g].length+')';b.onclick=()=>{filterGroup=filterGroup===g?'':g;renderAll()};d.appendChild(b)})}
function visibleKeys(){let q=$('search').value.toLowerCase();return allMembers().filter(m=>(!filterGroup||m.g===filterGroup)&&m.name.toLowerCase().includes(q)).map(m=>m.key)}
function renderStats(){$('summary').textContent=`登録 ${allMembers().length}名　選択 ${activeNames().length}名　配置済み ${occupiedNames().length}名　残り ${remaining().length}名`;$('status').textContent=activeNames().length?`${mode==='city'?'都市':'地球儀'}モード・${activeNames().length}名選択中`:'抽選する名前を選択してください';$('one').disabled=$('pair').disabled=$('all').disabled=!selected.size||busy}
function addAt(cls,cell,text){let p=pos(cell),d=document.createElement('div');d.className=cls;d.style.left=p.x+'%';d.style.top=p.y+'%';d.textContent=text;board.appendChild(d);fit(d);return d}
function trapAt(cell,title,time){let d=document.createElement('div');d.className='trapText';d.innerHTML='<span class="trapTitle">'+title+'</span><span class="trapTime">'+time+'〜</span>';d.style.left='57.126%';d.style.top=(cell==='H12'?'64.325%':'38.097%');d.setAttribute('aria-label',title+' '+time+'〜');board.appendChild(d);return d}
function coordLabel(cell,text){let p=pos(cell),d=document.createElement('div');d.className='cellCoordLabel';d.textContent=text;d.style.left=(p.x-2.336)+'%';d.style.top=(p.y-2.042)+'%';board.appendChild(d);return d}
function facilityAt(cls,text,left,top){let d=document.createElement('div');d.className='facilityOverlay '+cls;d.textContent=text;d.style.left=left+'%';d.style.top=top+'%';board.appendChild(d);return d}
function renderBoard(){board.querySelectorAll('.target,.hit,.tag,.candidate,.bearLabel,.mapCover,.fixedTsuru,.mergedZone,.gridMask,.trapPatch,.trapText,.facilityOverlay,.cellCoordLabel').forEach(x=>x.remove());pool().filter(c=>!MERGED.has(c)).forEach(c=>addAt('target',c,''));MANUAL_CELLS.forEach(c=>{let h=addAt('hit',c,'');h.onclick=()=>manualPlace(c)});Object.entries(state).forEach(([c,n])=>{if(!MERGED.has(c))addAt('tag',c,n)});coordLabel('F9','F9');facilityAt('facilityHQ','本部','32.482','50.038');facilityAt('facilityIron','同盟鉄鉱場','52.97','24.93');facilityAt('facilityIron','同盟鉄鉱場','80.29','20.14');facilityAt('facilityCoal','同盟石炭工場','80.29','39.24');let b1=trapAt('H6','熊罠①',$('bear1time').value);b1.onclick=()=>pickTrapTime('bear1time');let b2=trapAt('H12','熊罠②',$('bear2time').value);b2.onclick=()=>pickTrapTime('bear2time');board.classList.toggle('manualOn',manual);renderStats();saveAll()}
function pickTrapTime(id){let old=document.querySelector('.timePickerModal');if(old)old.remove();let wrap=document.createElement('div');wrap.className='timePickerModal';let panel=document.createElement('div');panel.className='timePickerPanel';let title=id==='bear1time'?'熊罠①':'熊罠②';panel.innerHTML='<h3>'+title+'の時間</h3><input type="time" value="'+$(id).value+'"><div class="timePickerActions"><button class="timeCancel">キャンセル</button><button class="timeOk">決定</button></div>';panel.querySelector('.timeCancel').onclick=()=>wrap.remove();panel.querySelector('.timeOk').onclick=()=>{let v=panel.querySelector('input').value;if(v){$(id).value=v;wrap.remove();renderBoard()}};wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};wrap.appendChild(panel);document.body.appendChild(wrap);setTimeout(()=>panel.querySelector('input').focus(),0)}
function renderAll(){renderGroupButtons();renderMembers();renderBoard()}
function snapshot(){history.push(JSON.stringify(state));if(history.length>60)history.shift()}
function manualPlace(cell){if(!manual||busy||!MANUAL_CELLS.includes(cell))return;let current=state[cell]||'',used=new Set(occupiedNames().filter(n=>n!==current)),members=allMembers().filter(m=>m.name&&m.name!=='つるちゃん'&&!used.has(m.name));let wrap=document.createElement('div');wrap.className='manualPicker';let panel=document.createElement('div');panel.innerHTML='<b>'+cell+(current?' の名前を編集':' に配置する名前')+'</b><input class="search" placeholder="名前を検索">';let bar=document.createElement('div');bar.className='mpGroups';let list=document.createElement('div');list.className='mpList';let active='';function redraw(){let q=panel.querySelector('input').value.toLowerCase();list.innerHTML='';members.filter(m=>(!active||m.g===active)&&m.name.toLowerCase().includes(q)).forEach(m=>{let b=document.createElement('button');b.className='mpName';b.style.setProperty('--gc',COLORS[m.g]);b.textContent=m.g+'｜'+m.name;b.onclick=()=>{snapshot();state[cell]=m.name;wrap.remove();$('result').textContent=m.name+' を '+cell+' に配置';renderBoard()};list.appendChild(b)})}function gb(g,label,c){let b=document.createElement('button');b.className='mpGroup';b.style.setProperty('--gc',c);b.textContent=label;b.onclick=()=>{active=g;redraw()};bar.appendChild(b)}gb('','全て','#64798a');Object.keys(groups).forEach(g=>gb(g,g,COLORS[g]));panel.querySelector('input').oninput=redraw;panel.append(bar,list);if(current){let remove=document.createElement('button');remove.className='cancel';remove.style.background='#d54d42';remove.textContent='このマスを元に戻す';remove.onclick=()=>{snapshot();delete state[cell];wrap.remove();$('result').textContent=cell+' を元に戻しました';renderBoard()};panel.appendChild(remove)}let cancel=document.createElement('button');cancel.className='cancel';cancel.textContent='キャンセル';cancel.onclick=()=>wrap.remove();panel.appendChild(cancel);wrap.appendChild(panel);document.body.appendChild(wrap);redraw()}
function neighbors(c){let col=c.charCodeAt(0),row=+c.slice(1);return [String.fromCharCode(col-1)+row,String.fromCharCode(col+1)+row,String.fromCharCode(col)+(row-1),String.fromCharCode(col)+(row+1)]}
function adjacentPairs(spaces){let set=new Set(spaces),out=[];spaces.forEach(a=>neighbors(a).forEach(b=>{if(set.has(b)&&a<b)out.push([a,b])}));return out}
function setBusy(v){busy=v;renderStats()}
function fitGlobeMap(){let ratio=1263/1445,w=Math.min(window.innerWidth-8,(window.innerHeight-52)*ratio);board.style.width=Math.max(230,w)+'px';viewport.scrollLeft=0;viewport.scrollTop=0}
function closeGlobeStage(){$('mapSection').classList.remove('globePresent');viewport.classList.remove('globeFit');board.style.width='100%'}
function focusMap(){board.style.transform='scale(1)';$('mapSection').classList.add('globePresent');viewport.classList.add('globeFit');requestAnimationFrame(fitGlobeMap)}
function sparkle(){for(let i=0;i<36;i++){let s=document.createElement('div');s.className='spark';s.textContent=['✨','★','◆','🎉'][i%4];s.style.left=Math.random()*100+'vw';s.style.top=(55+Math.random()*40)+'vh';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2300)}}
function animateOne(){if(busy)return;let people=remaining(),spaces=free();if(!people.length)return $('result').textContent='選択メンバーは全員配置済みです';if(!spaces.length)return $('result').textContent=mode==='city'&&!$('area').value?'抽選エリアを選択してください':'空きマスがありません';setBusy(true);focusMap();let person=pick(people),route=Array.from({length:11},()=>pick(spaces)),final=mode==='globe'?weightedCell(spaces):pick(spaces);route.push(final);let i=0;function step(){board.querySelectorAll('.candidate').forEach(x=>x.remove());addAt('candidate',route[i],person);$('result').textContent=person+' → '+route[i]+' ?';if(++i<route.length)setTimeout(step,180+i*18);else setTimeout(()=>{board.querySelectorAll('.candidate').forEach(x=>x.remove());snapshot();state[final]=person;renderBoard();let t=[...board.querySelectorAll('.tag')].find(x=>x.textContent===person);if(mode==='globe'&&RARE.includes(final)){t&&t.classList.add('rareWin');sparkle();$('result').textContent='🎊 レア配置！ '+person+' → '+final+' 🎊'}else $('result').textContent=person+' → '+final;setBusy(false)},450)}step()}
function drawPair(){if(mode==='globe'){$('result').textContent='地球儀ルーレットは1人抽選のみです';return}if(busy)return;let people=remaining();if(people.length!==2){$('result').textContent='ペア抽選は未配置の名前を2人ちょうど選択してください（現在 '+people.length+'人）';return}let pairs=adjacentPairs(free());if(!pairs.length){$('result').textContent='隣り合う空きマスがありません';return}setBusy(true);focusMap();let p1=people[0],p2=people[1],route=Array.from({length:11},()=>pick(pairs)),final=pick(pairs);route.push(final);let i=0;function step(){board.querySelectorAll('.candidate').forEach(x=>x.remove());let cells=route[i];addAt('candidate',cells[0],p1);addAt('candidate',cells[1],p2);$('result').textContent=`ペア抽選中：${p1}・${p2} → ${cells[0]}・${cells[1]} ?`;if(++i<route.length)setTimeout(step,180+i*18);else setTimeout(()=>{board.querySelectorAll('.candidate').forEach(x=>x.remove());snapshot();state[final[0]]=p1;state[final[1]]=p2;renderBoard();$('result').textContent=`ペア当選：${p1} → ${final[0]} ／ ${p2} → ${final[1]}`;setBusy(false)},450)}step()}
function animateAll(){if(mode==='globe'){$('result').textContent='地球儀ルーレットは1人抽選のみです';return}if(busy)return;let people=remaining(),spaces=free();if(!people.length){$('result').textContent='未配置の選択メンバーがいません';return}if(spaces.length<people.length){$('result').textContent='選択人数分の空きマスがありません';return}setBusy(true);focusMap();let finalCells=[],available=[...spaces];people.forEach(()=>{let c=mode==='globe'?weightedCell(available):pick(available);finalCells.push(c);available=available.filter(x=>x!==c)});let rounds=12,i=0;function randomUnique(){let a=[...spaces],out=[];people.forEach(()=>{let c=pick(a);out.push(c);a=a.filter(x=>x!==c)});return out}function step(){board.querySelectorAll('.candidate').forEach(x=>x.remove());let cells=i===rounds-1?finalCells:randomUnique();people.forEach((person,j)=>addAt('candidate',cells[j],person));$('result').textContent=`${people.length}人を同時抽選中… ${i+1}/${rounds}`;i++;if(i<rounds)setTimeout(step,180+i*18);else setTimeout(()=>{board.querySelectorAll('.candidate').forEach(x=>x.remove());snapshot();people.forEach((person,j)=>state[finalCells[j]]=person);renderBoard();$('result').textContent='同時抽選完了：'+people.map((n,j)=>`${n} → ${finalCells[j]}`).join(' ／ ');setBusy(false)},450)}step()}
$('cityMode').onclick=()=>{mode='city';selected=selectedCity;state=stateCity;closeGlobeStage();$('cityMode').classList.add('active');$('globeMode').classList.remove('active');$('area').disabled=false;$('pair').disabled=false;$('all').disabled=false;$('modeNote').textContent='青いマスが抽選対象です。';board.style.transform='scale(1)';renderAll()};$('globeMode').onclick=()=>{mode='globe';selected=selectedGlobe;state=stateGlobe;closeGlobeStage();$('globeMode').classList.add('active');$('cityMode').classList.remove('active');$('area').disabled=true;$('pair').disabled=true;$('all').disabled=true;$('modeNote').textContent='地球儀ルーレットは1人抽選のみです。通常マスが高確率、中心周辺8マスが低確率のレア配置です。';board.style.transform='scale(1)';renderAll()};
$('one').onclick=animateOne;$('pair').onclick=drawPair;$('all').onclick=animateAll;$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());if(mode==='city')stateCity=state;else stateGlobe=state;renderBoard()}};$('reset').onclick=()=>{if(confirm('配置結果を全部消しますか？')){snapshot();state={};if(mode==='city')stateCity=state;else stateGlobe=state;renderBoard();$('result').textContent='配置をリセットしました'}};$('manual').onclick=()=>{manual=!manual;$('manual').textContent='📌 手動配置 '+(manual?'ON':'OFF');renderBoard()};$('search').oninput=renderMembers;$('showAll').onclick=()=>{filterGroup='';$('search').value='';renderAll()};$('selectVisible').onclick=()=>{visibleKeys().forEach(k=>selected.add(k));saveAll();renderMembers()};$('clearVisible').onclick=()=>{visibleKeys().forEach(k=>selected.delete(k));saveAll();renderMembers()};$('addMember').onclick=()=>{let g=prompt('追加先グループ（R1～R5）','R3');if(!groups[g])return;let n=prompt('追加する名前');if(n&&n.trim()){groups[g].push(n.trim());saveAll();renderAll()}};$('restore').onclick=()=>{if(confirm('名前の編集内容と選択状態を初期化しますか？')){groups=JSON.parse(JSON.stringify(DEFAULT_GROUPS));selectedCity.clear();selectedGlobe.clear();selected=mode==='city'?selectedCity:selectedGlobe;saveAll();renderAll()}};$('area').onchange=renderBoard;['bear1time','bear2time'].forEach(id=>$(id).onchange=renderBoard);
window.addEventListener('resize',()=>{if($('mapSection').classList.contains('globePresent'))fitGlobeMap()});
board.addEventListener('click',e=>{let tag=e.target.closest('.tag');if(!tag||tag.classList.contains('fixedTsuru'))return;let placed=Object.entries(state).find(([c,n])=>n===tag.textContent);if(placed){e.preventDefault();e.stopPropagation();manualPlace(placed[0])}},true);
$('globeClose').onclick=closeGlobeStage;
try{['cr4_selected_city','cr4_selected_globe','cr3_selected','cr6_state_city','cr6_state_globe','cr3_state'].forEach(k=>localStorage.removeItem(k))}catch(e){}
$('bear1time').value=localStorage.getItem('cr3_b1')||'20:50';$('bear2time').value=localStorage.getItem('cr3_b2')||'22:40';renderAll();
</script></body></html>
